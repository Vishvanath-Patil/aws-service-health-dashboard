name: Sync AWS health snapshot

# Fetches the AWS public health feed server-side (CORS doesn't apply server-to-server),
# decodes the UTF-16 response into clean UTF-8 JSON, and commits it to the repo.
# The static site reads the committed snapshot, so no browser-side cross-origin fetch.
#
# Scheduled to run every 30 minutes. Also manually triggerable.
# An unchanged feed produces no commit (git-auto-commit's skip_dirty guard).

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: health-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch AWS public health feed
        run: curl -sL --max-time 60 "https://health.aws.amazon.com/public/currentevents" -o /tmp/feed.utf16
        shell: bash

      - name: Normalize snapshot
        run: python3 scripts/process_feed.py /tmp/feed.utf16 data/health-snapshot.json
        shell: bash

      - name: Commit snapshot if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(health): update AWS health snapshot"
          file_pattern: "data/health-snapshot.json"
          skip_dirty_check: false
